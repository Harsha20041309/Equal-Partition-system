<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equal Partition System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Equal Partition System</h1>
            <p>Enter a list of numbers separated by spaces to check if they can be divided into two subsets with equal sum.</p>
            
            <div class="input-group">
                <input type="text" id="numbersInput" placeholder="Example: 1 5 11 5" autocomplete="off">
                <button id="checkButton">Check Partition</button>
            </div>

            <div id="result" class="result-box hidden">
                <span id="resultMessage"></span>
            </div>
            
            <div class="algorithm-info">
                <h3>How it works:</h3>
                <p>The system uses <strong>Dynamic Programming</strong> to solve the Subset Sum Problem, checking if a subset exists that sums to exactly half of the total sum.</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('checkButton').addEventListener('click', async () => {
            const input = document.getElementById('numbersInput').value;
            console.log("DEBUG: User Input:", input);

            if (!input.trim()) {
                showMessage({ message: "Please enter some numbers." }, false);
                return;
            }

            try {
                // Send request to /partition route
                const response = await fetch('/partition', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ numbers: input }),
                });

                console.log("DEBUG: Response Status:", response.status);

                // Check if response is JSON
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new TypeError("Server did not return JSON. Please check backend logs.");
                }

                const data = await response.json();
                console.log("DEBUG: Parsed JSON Data:", data);

                if (data.success) {
                    showMessage(data, data.possible);
                } else {
                    // Show error message from backend
                    showMessage(data, false, true);
                }
            } catch (error) {
                console.error("DEBUG: Fetch Error:", error);
                showMessage({ message: error.message || "An error occurred. Please try again." }, false, true);
            }
        });

        function showMessage(data, isPossible, isError = false) {
            const resultBox = document.getElementById('result');
            const resultMessage = document.getElementById('resultMessage');

            // Clear previous results
            resultMessage.innerHTML = '';
            
            resultBox.classList.remove('hidden', 'success', 'failure', 'error');
            
            if (isError) {
                resultBox.classList.add('error');
                resultMessage.innerText = data.message;
            } else if (isPossible) {
                resultBox.classList.add('success');
                
                const title = document.createElement('div');
                title.className = 'result-message-title';
                title.innerText = data.message;
                resultMessage.appendChild(title);

                if (data.solutions && data.solutions.length >= 10) {
                    const limitInfo = document.createElement('p');
                    limitInfo.style.fontSize = '0.85rem';
                    limitInfo.style.marginBottom = '1rem';
                    limitInfo.style.fontStyle = 'italic';
                    limitInfo.innerText = "(Showing first 10 solutions)";
                    resultMessage.appendChild(limitInfo);
                }
                
                const solutionsContainer = document.createElement('div');
                solutionsContainer.className = 'solutions-list';
                
                data.solutions.forEach((sol, index) => {
                    const solutionWrapper = document.createElement('div');
                    solutionWrapper.className = 'solution-wrapper';
                    
                    const solHeader = document.createElement('h4');
                    solHeader.innerText = `Solution ${index + 1}:`;
                    solHeader.style.marginBottom = '8px';
                    solHeader.style.textAlign = 'left';
                    solHeader.style.fontSize = '1rem';
                    solutionWrapper.appendChild(solHeader);

                    const container = document.createElement('div');
                    container.className = 'subset-container';
                    
                    const createSubsetDiv = (label, items) => {
                        const div = document.createElement('div');
                        div.className = 'subset-box';
                        div.innerHTML = `<span class="subset-label">${label}:</span> [${items.join(', ')}]`;
                        return div;
                    };
                    
                    container.appendChild(createSubsetDiv('Subset 1', sol.subset1));
                    container.appendChild(createSubsetDiv('Subset 2', sol.subset2));
                    
                    solutionWrapper.appendChild(container);
                    solutionsContainer.appendChild(solutionWrapper);
                });
                
                resultMessage.appendChild(solutionsContainer);
            } else {
                resultBox.classList.add('failure');
                resultMessage.innerText = data.message;
            }
        }
    </script>
</body>
</html>
